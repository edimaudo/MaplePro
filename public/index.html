<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MaplePro</title>
<script>try{var t=localStorage.getItem("mp-theme"),d=t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.classList.toggle("dark",d);document.documentElement.classList.toggle("lg",localStorage.getItem("mp-font")==="lg")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:"class"}</script>
<style>
:root{--bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--side:#0f172a;--field:#fff;--hover:#f1f5f9}
.dark{--bg:#0b1220;--surface:#111a2e;--border:#24304a;--text:#e5e7eb;--muted:#94a3b8;--side:#070d1a;--field:#0b1220;--hover:#1a2540}
html{font-size:16px}html.lg{font-size:18px}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}.muted{color:var(--muted)}.link{color:#2563eb;text-decoration:underline}.dark .link{color:#93c5fd}
.card{background:var(--surface);border:1px solid var(--border);border-radius:.75rem}
.input{width:100%;border:1px solid var(--border);background:var(--field);color:var(--text);border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;border-radius:.5rem;padding:.5rem .875rem;font-size:.875rem;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}.btn:disabled{opacity:.5}.btn-primary{background:#2563eb;border-color:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn:focus-visible,.input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
table{border-collapse:collapse}th{font-weight:500;color:var(--muted);text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
td,th{padding:.75rem 1rem;border-bottom:1px solid var(--border);vertical-align:middle}tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:.125rem .5rem;border-radius:9999px;font-size:.75rem;font-weight:500;white-space:nowrap}
.b-ok{background:#dcfce7;color:#166534}.b-warn{background:#fef3c7;color:#92400e}.b-bad{background:#fee2e2;color:#991b1b}.b-info{background:#dbeafe;color:#1e40af}.b-n{background:var(--hover);color:var(--muted)}
.dark .b-ok{background:#14532d;color:#bbf7d0}.dark .b-warn{background:#713f12;color:#fde68a}.dark .b-bad{background:#7f1d1d;color:#fecaca}.dark .b-info{background:#1e3a8a;color:#bfdbfe}
.tab{padding:.5rem 1rem;font-size:.875rem;border-bottom:2px solid transparent;color:var(--muted)}.tab.on{border-color:#2563eb;color:var(--text);font-weight:500}
summary{list-style:none}summary::-webkit-details-marker{display:none}
</style></head>
<body><div id="app"><p style="font:14px sans-serif;padding:2rem">Loading...</p></div>
<script src="/engine.js"></script><script src="/app.js"></script></body></html>
