{% extends "base.html" %}{% block body %}
<h1 class="text-xl font-semibold">{{title}}</h1><p class="text-sm text-slate-500">You asked: {{q}}</p>
<div class="mt-4 space-y-2">{% for t,l in lines %}<a href="{{l}}" class="block rounded-lg border bg-white p-3 text-sm hover:border-blue-400">{{t}}</a>{% else %}<p class="text-sm text-slate-500">Nothing to show.</p>{% endfor %}</div>{% endblock %}
